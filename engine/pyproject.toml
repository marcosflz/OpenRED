[project]
name = "openred-engine"
version = "0.2.0"
description = "OpenRED headless calculation engine (JSON-RPC over stdio)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
authors = [{ name = "OpenRED contributors" }]
dependencies = [
    "numpy==2.1.2",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "ruff==0.8.6",
    "jsonschema==4.23.0",
]

[project.scripts]
openred-engine = "openred_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openred_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: numerical parity against legacy fixtures",
    "serial: serial transport tests (mocked)",
    "slow: simulations taking more than a few seconds",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "UP031", "E741"]
